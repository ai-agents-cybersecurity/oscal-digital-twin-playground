# Scenario: Weak Password Policy
# Tests the impact of reducing password requirements

name: "Weak Password Policy"
description: |
  What-if scenario with weakened password requirements.
  This affects IA-5(1) (Authenticator Management - Password-Based Authentication).

changes:
  - component: idp
    attribute: password_min_length
    value: 6
  - component: idp
    attribute: password_complexity
    value: false
