[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oscal-digital-twin-lab"
version = "0.1.0"
description = "OSCAL-powered digital twin playground with LangGraph agents for continuous compliance assurance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OSCAL Digital Twin Lab" }
]
keywords = ["oscal", "digital-twin", "langgraph", "compliance", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
oscal-dtl = "oscal_dtl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oscal_dtl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
